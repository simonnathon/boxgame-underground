<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOXGAME">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>BOXGAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6ec6ff;
    --sky-light: #bde3ff;
    --grass: #7ac74f;
    --grass-dark: #4a9e3f;
    --panel: #fffdf5;
    --ink: #262626;
    --accent: #3b4cca;
    --gold: #ffcb05;
    --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Press Start 2P", "Microsoft YaHei", "SimHei", sans-serif;
    background: linear-gradient(180deg, #bde3ff 0%, #6ec6ff 34%, #7ac74f 34.5%, #4a9e3f 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ink);
    overflow-x: hidden;
    user-select: none;
  }

  header { width: 100%; text-align: center; padding: 22px 0 6px; }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 3px;
    color: var(--gold);
    -webkit-text-stroke: 2px var(--accent);
    text-shadow: 3px 3px 0 rgba(0,0,0,.25);
  }

  /* 顶部状态 */
  .hud { display: flex; gap: 14px; margin: 16px 0 10px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 8px 16px;
    min-width: 96px;
    text-align: center;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
  }
  .stat .label { font-size: .6rem; color: #8a8a8a; letter-spacing: 1px; }
  .stat .value { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

  /* 标签栏 */
  .tabs {
    display: flex;
    gap: 8px;
    margin: 10px 0 6px;
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
  }
  .tab {
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    font-size: .7rem;
    letter-spacing: 1px;
    border: 2px solid transparent;
    transition: transform .1s, background .2s;
  }
  .tab:hover { transform: translateY(-2px); }
  .tab.active {
    background: var(--red);
    color: #fff;
    border-color: var(--ink);
    box-shadow: 2px 2px 0 rgba(0,0,0,.25);
    font-weight: 700;
  }

  .panel { display: none; width: 100%; max-width: 760px; padding: 12px; }
  .panel.active { display: block; }

  /* ===== 战斗（宝可梦风格） ===== */
  .battlefield {
    position: relative;
    height: 380px;
    max-width: 620px;
    margin: 8px auto 14px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, #bde3ff 0%, #8fd0ff 52%, #7ac74f 52%, #4a9e3f 100%);
    box-shadow: 5px 5px 0 rgba(0,0,0,.25);
  }
  .deco { position: absolute; pointer-events: none; opacity: .7; }
  .deco.star { color: #fff; font-size: 1rem; }
  .deco.cloud { color: #ffffff; font-size: 1.8rem; opacity: .9; }
  .ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
    background: linear-gradient(180deg, #7ac74f, #4a9e3f);
    border-top: 4px solid #2e6b25;
  }
  .ground::after {
    content: "🌿 🌾 🌷 🌾 🌿";
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: .8rem; opacity: .6; letter-spacing: 6px; white-space: nowrap;
  }

  .pkm { position: absolute; z-index: 2; text-align: center; }
  .pkm.player { left: 8%; bottom: 24%; }
  .pkm.enemy { right: 8%; top: 12%; }
  .pkm-sprite {
    display: inline-block;
    width: 150px;
    height: 150px;
    transform-origin: bottom center;
    filter: drop-shadow(4px 6px 0 rgba(0,0,0,.18));
    animation: bob 1.6s ease-in-out infinite;
  }
  .pkm-sprite svg { width: 100%; height: 100%; display: block; }
  .char-avatar svg { width: 64px; height: 64px; display: block; }
  .r-icon svg { width: 52px; height: 52px; display: block; margin: 0 auto; }
  .card .icon svg { width: 96px; height: 96px; display: block; margin: 0 auto; }
  /* 复古地下世界 RPG 风格：低分辨率栅格、硬边缩放、四阶黑白色板 */
  .pixel-sprite {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: url(#mono-palette) drop-shadow(4px 4px 0 #000);
  }
  .pkm-sprite { filter: none; }
  .pkm::after {
    content: "";
    position: absolute;
    z-index: -1;
    left: 50%;
    bottom: -5px;
    width: 132px;
    height: 28px;
    transform: translateX(-50%);
    border: 4px solid #306230;
    border-radius: 50%;
    background: repeating-linear-gradient(0deg, #8bac0f 0 4px, #9bbc0f 4px 8px);
    box-shadow: inset 0 -6px 0 #306230;
  }
  .char-avatar .pixel-sprite,
  .r-icon .pixel-sprite,
  .card .icon .pixel-sprite { filter: url(#mono-palette); }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  #pSprite.attack { animation: lunge-right .32s ease-out; }
  #eSprite.attack { animation: lunge-left .32s ease-out; }
  @keyframes lunge-right {
    0% { transform: translateX(0); }
    40% { transform: translateX(72px) scale(1.08); }
    100% { transform: translateX(0); }
  }
  @keyframes lunge-left {
    0% { transform: translateX(0); }
    40% { transform: translateX(-72px) scale(1.08); }
    100% { transform: translateX(0); }
  }
  #pSprite.hit { animation: hit-recoil .3s ease-out; --hitdir: -14px; }
  #eSprite.hit { animation: hit-recoil .3s ease-out; --hitdir: 14px; }
  @keyframes hit-recoil {
    0% { transform: translateX(0); filter: brightness(1); }
    30% { transform: translateX(var(--hitdir)); filter: brightness(2.2) saturate(.4) hue-rotate(-30deg); }
    100% { transform: translateX(0); filter: brightness(1); }
  }
  #pSprite.dead, #eSprite.dead { animation: die .5s ease-in forwards !important; }
  @keyframes die {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(30px) rotate(24deg); opacity: 0; }
  }
  .battlefield.paused .pkm-sprite { animation-play-state: paused; }

  .pkm-info {
    position: absolute;
    background: var(--panel);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 8px 12px;
    min-width: 190px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
    z-index: 5;
  }
  .info-enemy { top: 10px; left: 10px; }
  .info-player { bottom: 10px; right: 10px; }
  .pkm-name { font-size: .7rem; font-weight: 700; }
  .pkm-lv { font-size: .6rem; color: #7a7a7a; }
  .pkm-badge { margin-top: 4px; }
  .badge {
    display: inline-block; color: #fff; font-size: .55rem; font-weight: 700;
    padding: 1px 6px; border-radius: 6px; border: 1px solid var(--ink); letter-spacing: 1px;
    margin-right: 3px;
  }
  .hpbar {
    height: 12px;
    background: #e4e4e4;
    border: 2px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    margin: 5px 0 3px;
  }
  .hpbar > div { height: 100%; background: linear-gradient(90deg, #8df07f, #3fbf3f); transition: width .35s; }
  .hptext { font-size: .6rem; color: var(--ink); }

  .battle-controls { text-align: center; margin: 8px 0 4px; }
  .pause-btn {
    font-family: inherit;
    border: 3px solid var(--ink);
    border-radius: 16px;
    cursor: pointer;
    padding: 10px 28px;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: var(--panel);
    color: var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
    transition: transform .12s;
  }
  .pause-btn:hover { transform: translateY(-2px); }
  .pause-btn.paused { background: var(--gold); border-color: var(--ink); }
  .battle-status {
    text-align: center;
    color: var(--ink);
    font-size: .7rem;
    min-height: 22px;
    background: rgba(255,255,255,.85);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 6px 12px;
    max-width: 480px;
    margin: 8px auto 0;
  }
  .battle-status.dead { color: #fff; background: var(--red); font-weight: 700; }
  .float {
    position: absolute; left: 50%; top: 26%;
    transform: translateX(-50%);
    font-weight: 700; font-size: .9rem;
    pointer-events: none;
    animation: float-up 1s ease-out forwards;
    z-index: 10;
    text-shadow: 1px 1px 0 #fff;
  }
  @keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -46px); }
  }

  /* ===== 宝箱 ===== */
  .hint { margin: 6px auto 12px; font-size: .7rem; color: var(--ink); letter-spacing: 1px; text-align: center; background: rgba(255,255,255,.85); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; max-width: 520px; }
  .hint.reward { color: #c0452f; font-weight: 700; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 108px);
    grid-template-rows: repeat(3, 92px);
    gap: 14px;
    margin: 10px auto 26px;
    width: fit-content;
  }
  .chest { position: relative; cursor: pointer; transition: transform .15s; }
  .chest:hover { transform: scale(1.06); }
  .chest .lid {
    position: absolute; top: 0; left: 0;
    width: 108px; height: 38px;
    background: linear-gradient(180deg, #ff6b6b, #e0393a);
    border-radius: 14px 14px 3px 3px;
    border: 3px solid var(--ink);
    transform-origin: bottom center;
    transition: transform .6s cubic-bezier(.6,-0.3,.4,1.2);
    z-index: 3;
  }
  .chest .lid::after {
    content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 10px;
    background: var(--gold);
    border-radius: 4px; border: 2px solid var(--ink);
  }
  .chest .body {
    position: absolute; bottom: 0; left: 6px;
    width: 96px; height: 60px;
    background: linear-gradient(180deg, #ffffff, #e6e1d2);
    border-radius: 3px 3px 10px 10px;
    border: 3px solid var(--ink);
    z-index: 2;
  }
  .chest .body::after {
    content: ""; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 12px;
    background: var(--ink);
    border-radius: 4px;
  }
  .chest .lock {
    position: absolute; top: 33px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 24px;
    background: radial-gradient(circle at 40% 35%, #fff, var(--gold) 65%);
    border-radius: 50%;
    border: 3px solid var(--ink);
    z-index: 4; transition: transform .5s, opacity .5s;
  }
  .chest .lock::before { display: none; }
  .chest.open .lid { transform: rotateX(120deg); }
  .chest.open .lock { transform: translateX(-50%) translateY(8px) scale(.4); opacity: 0; }
  .chest.shake { animation: shake .5s ease-in-out; }
  .chest.disabled { pointer-events: none; filter: brightness(.75); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-4deg); }
    40% { transform: translateX(8px) rotate(4deg); }
    60% { transform: translateX(-6px) rotate(-3deg); }
    80% { transform: translateX(6px) rotate(3deg); }
  }
  .chest.reward .lid { background: linear-gradient(180deg, #ffd95e, #f0a500); border-color: var(--ink); }
  .chest.reward .body { background: linear-gradient(180deg, #fff3c4, #ffd95e); border-color: var(--ink); }
  .chest.reward { animation: reward-glow 1.1s infinite; border-radius: 10px; }
  @keyframes reward-glow {
    0%,100% { box-shadow: 0 0 10px 2px rgba(255,203,5,.5); }
    50% { box-shadow: 0 0 26px 8px rgba(255,203,5,.85); }
  }
  .chest.reward .badge {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: var(--red); color: #fff;
    font-size: .6rem; font-weight: 700; padding: 3px 8px; border-radius: 8px;
    border: 2px solid var(--ink);
    z-index: 5; letter-spacing: 1px; white-space: nowrap;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 200;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: var(--panel); border: 4px solid var(--ink); border-radius: 20px;
    padding: 28px 44px; text-align: center;
    transform: scale(.4); transition: transform .5s cubic-bezier(.2,1.4,.4,1);
    box-shadow: 6px 6px 0 rgba(0,0,0,.3); max-width: 88vw;
  }
  .overlay.show .card { transform: scale(1); }
  .card .icon { font-size: 5rem; filter: drop-shadow(3px 4px 0 rgba(0,0,0,.15)); }
  .card .name { font-size: 1.1rem; font-weight: 700; margin: 8px 0 4px; text-shadow: none; }
  .card .tier { font-size: .7rem; letter-spacing: 3px; opacity: .9; }
  .card .tag { display: block; margin-top: 10px; font-size: .6rem; color: #c0452f; letter-spacing: 2px; }
  .card .equip-info { margin-top: 8px; font-size: .7rem; color: #7a7a7a; }
  .card .race-line { margin-top: 8px; }
  .card-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .card-actions button {
    font-family: inherit; border: 2px solid var(--ink); border-radius: 10px; cursor: pointer;
    padding: 9px 16px; font-size: .65rem; font-weight: 700; letter-spacing: 1px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.25); transition: transform .12s;
  }
  .card-actions button:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-ghost { background: var(--panel); color: var(--ink); }

  /* ===== 角色 ===== */
  .char-card {
    background: var(--panel); border: 4px solid var(--ink); border-radius: 18px;
    padding: 20px; max-width: 540px; margin: 6px auto 14px;
    box-shadow: 5px 5px 0 rgba(0,0,0,.25);
  }
  .char-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .char-avatar { font-size: 3rem; }
  .char-name { font-size: .95rem; font-weight: 700; }
  .char-lv { font-size: .65rem; color: #7a7a7a; }
  .expbar { height: 10px; background: #e4e4e4; border: 2px solid var(--ink); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .expbar > div { height: 100%; background: linear-gradient(90deg, #8fb8ff, #3b4cca); transition: width .3s; }
  .exp-text { font-size: .6rem; color: #7a7a7a; margin-top: 3px; }
  .char-stats {
    display: flex; justify-content: space-around; text-align: center;
    margin: 14px 0; padding: 12px 0;
    border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  }
  .char-stats .cs .v { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .char-stats .cs .l { font-size: .6rem; color: #7a7a7a; }
  .equip-title { font-size: .7rem; color: #7a7a7a; margin-bottom: 8px; letter-spacing: 1px; }
  .equip-grid { display: flex; gap: 10px; }
  .equip-slot {
    flex: 1; border: 3px dashed var(--ink); border-radius: 12px;
    padding: 12px; text-align: center; min-height: 96px; position: relative;
    cursor: pointer; transition: border-color .2s;
  }
  .equip-slot:hover { border-color: var(--accent); }
  .equip-slot .slot-label { font-size: .6rem; color: #7a7a7a; }
  .equip-slot .e-icon { font-size: 2rem; margin: 4px 0; }
  .equip-slot .e-name { font-size: .7rem; }
  .equip-slot .empty { color: #b0b0b0; font-size: .6rem; margin-top: 10px; }
  .unequip {
    position: absolute; top: 4px; right: 4px;
    background: var(--red); color: #fff; border: 2px solid var(--ink); border-radius: 6px;
    font-size: .6rem; padding: 2px 6px; cursor: pointer;
  }

  .roster-title { text-align: center; font-size: .7rem; letter-spacing: 2px; color: #7a7a7a; margin: 18px 0 8px; }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
  .roster-card {
    background: var(--panel); border: 3px solid var(--ink); border-radius: 12px;
    padding: 10px; text-align: center; cursor: pointer; position: relative;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25); transition: transform .12s;
  }
  .roster-card:hover { transform: translateY(-2px); }
  .roster-card.active { border-color: var(--gold); background: #fffbe8; }
  .r-icon { font-size: 2rem; }
  .r-name { font-size: .65rem; font-weight: 700; margin: 4px 0 2px; }
  .r-lv { font-size: .55rem; color: #7a7a7a; }
  .r-badge { margin-top: 4px; }
  .r-tag {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: var(--red); color: #fff; font-size: .5rem; font-weight: 700;
    padding: 2px 6px; border-radius: 6px; border: 2px solid var(--ink);
  }

  /* ===== 背包 ===== */
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .item-card {
    background: var(--panel); border: 3px solid var(--ink); border-radius: 14px;
    padding: 12px; text-align: center; position: relative;
    box-shadow: 4px 4px 0 rgba(0,0,0,.25);
    animation: pop .4s ease;
  }
  .item-card .i-icon { font-size: 2.2rem; }
  .item-card .i-name { font-size: .7rem; margin: 6px 0 2px; }
  .item-card .i-count { font-size: .65rem; color: var(--accent); font-weight: 700; }
  .item-card .i-stats { font-size: .6rem; color: #7a7a7a; margin: 4px 0; line-height: 1.4; }
  .item-card button {
    font-family: inherit; border: 2px solid var(--ink); border-radius: 10px; cursor: pointer;
    padding: 6px 12px; font-size: .65rem; font-weight: 700; letter-spacing: 1px;
    background: var(--gold); color: var(--ink);
    box-shadow: 2px 2px 0 rgba(0,0,0,.25);
    transition: transform .12s;
  }
  .item-card button:hover { transform: translateY(-2px); }
  @keyframes pop {
    from { transform: scale(.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .empty-tip { text-align: center; color: #b0b0b0; padding: 30px 0; }

  .spark {
    position: fixed; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; z-index: 300;
    animation: spark-fly .9s ease-out forwards;
  }
  @keyframes spark-fly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ===== 全局复古地下世界 RPG 主题 ===== */
  :root {
    --sky: #000;
    --sky-light: #101010;
    --grass: #090909;
    --grass-dark: #000;
    --panel: #000;
    --ink: #fff;
    --accent: #ffff00;
    --gold: #ffff00;
    --red: #ff3030;
  }
  body {
    color: #fff;
    background-color: #000;
    background-image:
      radial-gradient(circle at 12% 18%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 82% 30%, #666 0 1px, transparent 2px),
      radial-gradient(circle at 55% 78%, #333 0 1px, transparent 2px);
    background-size: 83px 97px, 131px 113px, 157px 149px;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: .09;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px);
  }
  header { padding-top: 18px; }
  h1 {
    color: #fff;
    -webkit-text-stroke: 0;
    text-shadow: 4px 4px 0 #555;
  }
  h1::before { content: "* "; color: #ff3030; }
  .stat, .tabs, .pkm-info, .battle-status, .hint, .card,
  .char-card, .roster-card, .item-card {
    color: #fff;
    background: #000;
    border-color: #fff;
    border-radius: 0;
    box-shadow: 5px 5px 0 #555;
  }
  .stat .label, .pkm-lv, .char-lv, .exp-text, .char-stats .cs .l,
  .equip-title, .equip-slot .slot-label, .r-lv, .item-card .i-stats,
  .card .equip-info, .roster-title { color: #aaa; }

function charSVG(id) {
  const source = UT_SPRITES[id] || CHAR_SPRITES[id];
  if (!source) return charById(id) ? charById(id).icon : "";
  // 40×40 是刻意保留的低内部分辨率；放大时由 CSS 使用最近邻采样。
  const rasterSource = source.replace("<svg ", '<svg width="40" height="40" ');
  return `<img class="pixel-sprite" width="40" height="40" alt="" draggable="false" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(rasterSource)}">`;
}

const SLOTS = {
  weapon:    { label: "武器", icon: "⚔️" },
  armor:     { label: "护甲", icon: "🛡️" },
  accessory: { label: "饰品", icon: "💍" },
};

const COST = 10;
const CHEST_COUNT = 9;
const ATTACK_WIND = 320;
const ROUND_DELAY = 700;

let coins = 100;
let round = 1;
let opened = 0;
let legendaryCount = 0;
let inventory = {};
let equipment = { weapon:null, armor:null, accessory:null };
let rewardIndex = -1;
let busy = false;

let roster = { hero: { level:1, exp:0 } };
let activeId = "hero";

let player = { level:1, exp:0, hp:100, maxHp:100, atk:10, def:5, dead:false, respawnAt:0 };
let enemy = null;
let paused = false;
let combatTimer = null;

// ---------- 工具 ----------
function itemById(id) { return ITEMS.find(i => i.id === id); }
function charById(id) { return CHARACTERS.find(c => c.id === id); }
function activeChar() { return charById(activeId); }
function itemStatsText(it) {
  const parts = [];
  if (it.atk) parts.push("攻击+" + it.atk);
  if (it.def) parts.push("防御+" + it.def);
  if (it.hp) parts.push("生命+" + it.hp);
  return parts.join("  ");
}
function charStatsText(tpl) {
  const parts = [];
  if (tpl.atk) parts.push("攻击+" + tpl.atk);
  if (tpl.def) parts.push("防御+" + tpl.def);
  if (tpl.hp) parts.push("生命+" + tpl.hp);
  return parts.join("  ");
}
function badgeHTML(obj) {
  let html = "";
  if (obj.race && RACES[obj.race]) html += '<span class="badge" style="background:' + RACES[obj.race].color + '">' + RACES[obj.race].label + '</span>';
  if (obj.alignment && ALIGNMENTS[obj.alignment]) html += '<span class="badge" style="background:' + ALIGNMENTS[obj.alignment].color + '">' + ALIGNMENTS[obj.alignment].label + '</span>';
  return html;
}

// ---------- 角色与属性 ----------
function charBase(tpl, level) {
  return {
    maxHp: tpl.hp + (level - 1) * tpl.grow.hp,
    atk: tpl.atk + (level - 1) * tpl.grow.atk,
    def: tpl.def + (level - 1) * tpl.grow.def,
  };
}
function computeStats() {
  const tpl = activeChar();
  const rec = roster[activeId];
  player.level = rec.level;
  player.exp = rec.exp;
  const base = charBase(tpl, rec.level);
  let atk = base.atk, def = base.def, maxHp = base.maxHp;
  for (const slot of Object.values(equipment)) {
    const it = itemById(slot);
    if (it) { atk += it.atk || 0; def += it.def || 0; maxHp += it.hp || 0; }
  }
  const oldMax = player.maxHp || maxHp;
  const wasFull = !player.maxHp || player.hp >= oldMax;
  player.maxHp = maxHp; player.atk = atk; player.def = def;
  player.hp = wasFull ? maxHp : Math.min(player.hp, maxHp);
}
function expNeeded() { return player.level * 50; }
function gainExp(amount) {
  player.exp += amount;
  while (player.exp >= expNeeded()) {
    player.exp -= expNeeded();
    player.level++;
  }
  roster[activeId].level = player.level;
  roster[activeId].exp = player.exp;
  computeStats();
  player.hp = player.maxHp;
}
function gainGold(amount) { coins += amount; updateHud(); }

function setActive(id) {
  if (!roster[id] || id === activeId) return;
  roster[activeId].level = player.level;
  roster[activeId].exp = player.exp;
  activeId = id;
  const rec = roster[id];
  player.level = rec.level;
  player.exp = rec.exp;
  player.dead = false;
  computeStats();
  player.hp = player.maxHp;
  renderBattle(); renderCharacter(); renderBackpack(); updateHud();
}

// ---------- 敌人与战斗 ----------
function spawnEnemy() {
  const pool = CHARACTERS.filter(c => c.race === "monster");
  const tpl = pool[Math.floor(Math.random() * pool.length)];
  const lv = player.level + Math.floor(Math.random() * 2);
  const maxHp = tpl.hp + lv * 18;
  enemy = {
    name: tpl.name, cid: tpl.id, race: tpl.race, alignment: tpl.alignment, level: lv,
    maxHp: maxHp, hp: maxHp,
    atk: tpl.atk + lv * 2, def: tpl.def + lv,
    gold: 8 + lv * 3, exp: 10 + lv * 4,
  };
}

function floatText(box, text, color) {
  const s = document.createElement("div");
  s.className = "float";
  s.textContent = text;
  s.style.color = color;
  box.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}
function hitSprite(sprite) {
  sprite.classList.add("hit");
  setTimeout(() => sprite.classList.remove("hit"), 320);
}

function onEnemyDefeated() {
  gainGold(enemy.gold);
  gainExp(enemy.exp);
  floatText(enemyBox, "+" + enemy.gold + "金币", "#c07a00");
  floatText(enemyBox, "+" + enemy.exp + "经验", "#3b4cca");
  enemySprite.classList.add("dead");
  setTimeout(() => {
    spawnEnemy();
    enemySprite.classList.remove("dead");
    renderBattle();
  }, 700);
}

function onPlayerDeath() {
  player.dead = true;
  player.hp = 0;
  player.respawnAt = Date.now() + 3000;
  playerSprite.classList.add("dead");
}

function scheduleNext(delay) {
  combatTimer = setTimeout(() => { combatTimer = null; combatRound(); }, delay);
}
function startCombat() {
  if (paused || combatTimer) return;
  scheduleNext(400);
}
function stopCombat() {
  if (combatTimer) { clearTimeout(combatTimer); combatTimer = null; }
}

function combatRound() {
  if (paused) return;
  if (!enemy) { spawnEnemy(); renderBattle(); }

  if (player.dead) {
    if (Date.now() >= player.respawnAt) {
      player.dead = false;
      player.hp = player.maxHp;
      playerSprite.classList.remove("dead");
      renderBattle(); updateHud();
    } else {
      renderBattle(); updateHud();
    }
    scheduleNext(400);
    return;
  }

  // 玩家攻击阶段
  playerSprite.classList.add("attack");
  setTimeout(() => {
    if (paused) return;
    playerSprite.classList.remove("attack");
    if (!enemy) { scheduleNext(400); return; }

    const dmg = Math.max(1, player.atk - enemy.def);
    enemy.hp -= dmg;
    hitSprite(enemySprite);
    floatText(enemyBox, "-" + dmg, "#ff4d4d");
    renderBattle();

    if (enemy.hp <= 0) {
      enemy.hp = 0;
      onEnemyDefeated();
      scheduleNext(ROUND_DELAY + 700);
      return;
    }

    // 敌人反击阶段
    enemySprite.classList.add("attack");
    setTimeout(() => {
      if (paused) return;
      enemySprite.classList.remove("attack");
      const edmg = Math.max(1, enemy.atk - player.def);
      player.hp -= edmg;
      hitSprite(playerSprite);
      floatText(playerBox, "-" + edmg, "#ff4d4d");
      if (player.hp <= 0) onPlayerDeath();
      renderBattle(); updateHud();
      scheduleNext(ROUND_DELAY);
    }, ATTACK_WIND);
  }, ATTACK_WIND);
}

// ---------- 开宝箱 ----------
function rollTier() {
  const total = Object.values(TIERS).reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  let chosen = "common";
  for (const [key, t] of Object.entries(TIERS)) {
    r -= t.weight;
    if (r <= 0) { chosen = key; break; }
  }
  return chosen;
}
function poolOfTier(tier) {
  return ITEMS.filter(p => p.tier === tier).concat(CHARACTERS.filter(c => c.tier === tier));
}
function pickPrize() {
  const pool = poolOfTier(rollTier());
  return pool[Math.floor(Math.random() * pool.length)];
}
function pickLegendary() {
  const pool = poolOfTier("legendary");
  return pool[Math.floor(Math.random() * pool.length)];
}

function spawnSparks(tier) {
  const count = tier === "legendary" ? 40 : tier === "epic" ? 24 : 0;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = "50%";
    s.style.top = "40%";
    s.style.background = TIERS[tier].color;
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function applyConsumable(it) {
  if (it.effect === "gold") gainGold(it.value);
  else if (it.effect === "heal") { player.hp = player.maxHp; }
  else if (it.effect === "exp") gainExp(it.value);
}

function showPrize(prize, isReward, isDup) {
  const t = TIERS[prize.tier];
  if (prize.race) prizeIcon.innerHTML = charSVG(prize.id);
  else prizeIcon.textContent = prize.icon;
  prizeName.textContent = prize.name;
  prizeTier.textContent = "[" + t.label + "]";

  let stats = "", raceHtml = "", showActions = false;
  if (prize.race) {
    // 角色
    const raceLabel = RACES[prize.race].label;
    const alignLabel = prize.alignment ? " · " + ALIGNMENTS[prize.alignment].label : "";
    raceHtml = badgeHTML(prize);
    stats = charStatsText(prize);
    if (isDup) {
      stats = raceLabel + alignLabel + " · 已拥有，转化为经验 +30";
    } else {
      stats = raceLabel + alignLabel + " · " + stats;
      showActions = true;
    }
  } else if (prize.type === "consumable") {
    stats = prize.effect === "heal" ? "立即回复全部生命" : prize.effect === "gold" ? "+" + prize.value + " 金币" : "+" + prize.value + " 经验";
  } else {
    stats = itemStatsText(prize) + " · " + SLOTS[prize.type].label;
  }

  prizeStats.textContent = stats;
  prizeRace.innerHTML = raceHtml;
  prizeTag.textContent = isReward ? "★ 奖励宝箱 · 顶级物品 ★" : "";
  prizeActions.style.display = showActions ? "flex" : "none";
  if (showActions) {
    prizeEquipBtn.onclick = () => { setActive(prize.id); closePrize(); };
    prizeKeepBtn.onclick = closePrize;
  }
  card.style.color = t.color;
  overlay.classList.add("show");
  spawnSparks(prize.tier);
}

function gainPrize(prize) {
  if (prize.race) {
    if (roster[prize.id]) { gainExp(30); }
    else { roster[prize.id] = { level:1, exp:0 }; }
    return;
  }
  if (prize.type === "consumable") { applyConsumable(prize); return; }
  inventory[prize.id] = (inventory[prize.id] || 0) + 1;
}

function newRound() {
  rewardIndex = (round % 5 === 0) ? Math.floor(Math.random() * CHEST_COUNT) : -1;
  gridEl.innerHTML = "";
  for (let i = 0; i < CHEST_COUNT; i++) {
    const chest = document.createElement("div");
    chest.className = "chest" + (i === rewardIndex ? " reward" : "");
    chest.innerHTML =
      '<div class="lid"></div><div class="lock"></div><div class="body"></div>' +
      (i === rewardIndex ? '<div class="badge">奖励</div>' : '');
    chest.addEventListener("click", () => openChest(i, chest));
    gridEl.appendChild(chest);
  }
  updateHud();
}

function openChest(index, el) {
  if (busy || coins < COST) return;
  busy = true;
  coins -= COST;
  updateHud();

  const isReward = index === rewardIndex;
  el.classList.add("shake");

  setTimeout(() => {
    el.classList.remove("shake");
    el.classList.add("open");
    const prize = isReward ? pickLegendary() : pickPrize();
    const isDup = prize.race ? !!roster[prize.id] : false;
    showPrize(prize, isReward, isDup);
    gainPrize(prize);
    opened++;
    if (prize.tier === "legendary") legendaryCount++;
    updateHud();

    if (prize.race && !isDup) {
      // 等待用户选择出战或收藏
    } else {
      setTimeout(closePrize, 1800);
    }
  }, 550);
}

function closePrize() {
  overlay.classList.remove("show");
  busy = false;
  round++;
  newRound();
  renderCharacter();
  renderBackpack();
}

// ---------- 穿戴 ----------
function equip(id) {
  const it = itemById(id);
  if (!it || !SLOTS[it.type]) return;
  const slot = it.type;
  if (equipment[slot]) inventory[equipment[slot]] = (inventory[equipment[slot]] || 0) + 1;
  equipment[slot] = id;
  inventory[id]--;
  if (inventory[id] <= 0) delete inventory[id];
  computeStats();
  renderCharacter(); renderBackpack(); renderBattle(); updateHud();
}
function unequip(slot) {
  if (!equipment[slot]) return;
  inventory[equipment[slot]] = (inventory[equipment[slot]] || 0) + 1;
  equipment[slot] = null;
  computeStats();
  renderCharacter(); renderBackpack(); renderBattle(); updateHud();
}

// ---------- 渲染 ----------
const gridEl = document.getElementById("grid");
const hintEl = document.getElementById("hint");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const prizeIcon = document.getElementById("prizeIcon");
const prizeName = document.getElementById("prizeName");
const prizeTier = document.getElementById("prizeTier");
const prizeStats = document.getElementById("prizeStats");
const prizeRace = document.getElementById("prizeRace");
const prizeTag = document.getElementById("prizeTag");
const prizeActions = document.getElementById("prizeActions");
const prizeEquipBtn = document.getElementById("prizeEquip");
const prizeKeepBtn = document.getElementById("prizeKeep");
const coinsEl = document.getElementById("coins");
const levelEl = document.getElementById("level");
const roundEl = document.getElementById("round");
const legendaryEl = document.getElementById("legendary");
const invGrid = document.getElementById("invGrid");
const equipGrid = document.getElementById("equipGrid");
const rosterGrid = document.getElementById("rosterGrid");
const playerBox = document.querySelector(".pkm.player");
const enemyBox = document.querySelector(".pkm.enemy");
const playerSprite = document.getElementById("pSprite");
const enemySprite = document.getElementById("eSprite");
const battlefield = document.getElementById("battlefield");
const battleStatus = document.getElementById("battleStatus");
const pauseBtn = document.getElementById("pauseBtn");

function updateHud() {
  coinsEl.textContent = coins;
  levelEl.textContent = player.level;
  roundEl.textContent = round;
  legendaryEl.textContent = legendaryCount;

  if (rewardIndex >= 0) {
    hintEl.textContent = "本回合有金色奖励宝箱，可获得顶级物品！";
    hintEl.className = "hint reward";
  } else {
    const remain = Math.ceil(round / 5) * 5 - round;
    hintEl.textContent = "每回合选一个宝箱 · 距奖励宝箱还有 " + remain + " 回合";
    hintEl.className = "hint";
  }
}

function renderBattle() {
  const tpl = activeChar();
  pSprite.innerHTML = charSVG(tpl.id);
  document.getElementById("pName").textContent = tpl.name;
  document.getElementById("pLv").textContent = "Lv." + player.level;
  document.getElementById("pBadge").innerHTML = badgeHTML(tpl);
  document.getElementById("pHp").style.width = Math.max(0, player.hp / player.maxHp * 100) + "%";
  document.getElementById("pHpText").textContent = Math.max(0, Math.ceil(player.hp)) + " / " + player.maxHp;

  if (enemy) {
    enemySprite.innerHTML = charSVG(enemy.cid);
    document.getElementById("eName").textContent = enemy.name;
    document.getElementById("eLv").textContent = "Lv." + enemy.level;
    document.getElementById("eBadge").innerHTML = badgeHTML(enemy);
    document.getElementById("eHp").style.width = Math.max(0, enemy.hp / enemy.maxHp * 100) + "%";
  }

  if (player.dead) {
    const s = Math.max(0, Math.ceil((player.respawnAt - Date.now()) / 1000));
    battleStatus.textContent = tpl.name + " 已阵亡，" + s + " 秒后复活…";
    battleStatus.className = "battle-status dead";
  } else if (!paused) {
    battleStatus.textContent = tpl.name + " 自动战斗中 · 击杀敌人获得金币与经验";
    battleStatus.className = "battle-status";
  }
}

function renderCharacter() {
  const tpl = activeChar();
  document.getElementById("cAvatar").innerHTML = charSVG(tpl.id);
  document.getElementById("cName").textContent = tpl.name;
  document.getElementById("cBadge").innerHTML = badgeHTML(tpl);
  document.getElementById("charLv").textContent = "等级 " + player.level;
  const need = expNeeded();
  document.getElementById("expBar").style.width = Math.min(100, player.exp / need * 100) + "%";
  document.getElementById("expText").textContent = "经验 " + player.exp + " / " + need;
  document.getElementById("cHp").textContent = player.maxHp;
  document.getElementById("cAtk").textContent = player.atk;
  document.getElementById("cDef").textContent = player.def;

  equipGrid.innerHTML = "";
  for (const [slotKey, slotDef] of Object.entries(SLOTS)) {
    const slot = document.createElement("div");
    slot.className = "equip-slot";
    const eqId = equipment[slotKey];
    if (eqId) {
      const it = itemById(eqId);
      slot.style.borderColor = TIERS[it.tier].color;
      slot.innerHTML =
        '<div class="slot-label">' + slotDef.icon + " " + slotDef.label + '</div>' +
        '<div class="e-icon">' + it.icon + '</div>' +
        '<div class="e-name">' + it.name + '</div>' +
        '<div class="slot-label">' + itemStatsText(it) + '</div>' +
        '<button class="unequip">卸下</button>';
      slot.querySelector(".unequip").addEventListener("click", e => { e.stopPropagation(); unequip(slotKey); });
    } else {
      slot.innerHTML =
        '<div class="slot-label">' + slotDef.icon + " " + slotDef.label + '</div>' +
        '<div class="empty">未穿戴</div>';
    }
    equipGrid.appendChild(slot);
  }

  renderRoster();
}

function renderRoster() {
  rosterGrid.innerHTML = "";
  for (const id of Object.keys(roster)) {
    const tpl = charById(id);
    if (!tpl) continue;
    const rec = roster[id];
    const active = id === activeId;
    const cardEl = document.createElement("div");
    cardEl.className = "roster-card" + (active ? " active" : "");
    cardEl.innerHTML =
      '<div class="r-icon">' + charSVG(id) + '</div>' +
      '<div class="r-name">' + tpl.name + '</div>' +
      '<div class="r-badge">' + badgeHTML(tpl) + '</div>' +
      '<div class="r-lv">Lv.' + rec.level + '</div>' +
      (active ? '<div class="r-tag">出战</div>' : '');
    cardEl.addEventListener("click", () => setActive(id));
    rosterGrid.appendChild(cardEl);
  }
}

function renderBackpack() {
  invGrid.innerHTML = "";
  const entries = Object.entries(inventory);
  if (entries.length === 0) {
    invGrid.innerHTML = '<div class="empty-tip">背包空空如也，去开宝箱吧！</div>';
    return;
  }
  for (const [id, count] of entries) {
    const it = itemById(id);
    const cardEl = document.createElement("div");
    cardEl.className = "item-card";
    cardEl.style.borderColor = TIERS[it.tier].color;
    let body =
      '<div class="i-icon">' + it.icon + '</div>' +
      '<div class="i-name">' + it.name + '</div>' +
      '<div class="i-count">×' + count + '</div>';
    if (SLOTS[it.type]) {
      body += '<div class="i-stats">' + SLOTS[it.type].label + " · " + itemStatsText(it) + '</div>';
      body += '<button>穿戴</button>';
    }
    cardEl.innerHTML = body;
    if (SLOTS[it.type]) {
      cardEl.querySelector("button").addEventListener("click", () => equip(id));
    }
    invGrid.appendChild(cardEl);
  }
}

// ---------- 标签切换 ----------
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + t.dataset.tab));
    if (t.dataset.tab === "character") renderCharacter();
    if (t.dataset.tab === "backpack") renderBackpack();
  });
});

// ---------- 暂停/继续 ----------
pauseBtn.addEventListener("click", () => {
  paused = !paused;
  if (paused) {
    stopCombat();
    pauseBtn.textContent = "▶️ 继续挂机";
    pauseBtn.classList.add("paused");
    battlefield.classList.add("paused");
    battleStatus.textContent = "⏸️ 挂机已暂停";
    battleStatus.className = "battle-status";
  } else {
    pauseBtn.textContent = "⏸️ 暂停挂机";
    pauseBtn.classList.remove("paused");
    battlefield.classList.remove("paused");
    battleStatus.textContent = "战斗自动进行中 · 击杀敌人获得金币与经验";
    battleStatus.className = "battle-status";
    startCombat();
  }
});

// ---------- 启动 ----------
computeStats();
player.hp = player.maxHp;
spawnEnemy();
newRound();
renderBattle();
renderCharacter();
renderBackpack();
startCombat();
</script>
